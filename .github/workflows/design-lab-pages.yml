name: Deploy XMB Design Lab

on:
  push:
    branches: [main]
    paths:
      - "design-lab/**"
      - "docs/capturas-ui/**"
      - "docs/ICONOGRAPHY.md"
      - "app/src/main/res/drawable/ic_xmb_*.xml"
      - ".github/workflows/design-lab-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-design-lab
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish Design Lab only
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage only the lab and its visual assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/design-lab _site/docs _site/app/src/main/res/drawable
          cp -a design-lab/. _site/design-lab/
          cp -a docs/capturas-ui _site/docs/capturas-ui
          cp docs/ICONOGRAPHY.md _site/docs/ICONOGRAPHY.md
          cp app/src/main/res/drawable/ic_xmb_*.xml _site/app/src/main/res/drawable/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0;url=./design-lab/">
            <title>XMB Lite Design Lab</title>
          </head>
          <body><a href="./design-lab/">Abrir XMB Lite Design Lab</a></body>
          </html>
          HTML
          touch _site/.nojekyll

      - name: Check bundled references
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/design-lab/index.html
          test -s _site/design-lab/editor.js
          test -s _site/design-lab/styles.css
          test -s _site/docs/capturas-ui/musica-azul.webp
          test -s _site/docs/capturas-ui/musica-violeta.webp
          test -s _site/app/src/main/res/drawable/ic_xmb_category_music.xml
          test -s _site/app/src/main/res/drawable/ic_xmb_category_video.xml
          test -s _site/app/src/main/res/drawable/ic_xmb_category_settings.xml
          node --check _site/design-lab/editor.js
          # Never publish Kotlin sources, Android manifests, or APKs.
          if find _site -type f \( -name '*.kt' -o -name '*.apk' -o -name 'AndroidManifest.xml' \) | grep -q .; then
            echo "Unexpected Android files in Pages artifact" >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
